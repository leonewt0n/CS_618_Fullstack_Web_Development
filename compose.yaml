version: '3.9'
services:
  blog-database:
    image: mongo
    ports:
      - '27017:27017'
  blog-backend:
    build: backend/
    environment:
      - PORT=3001
      - 'DATABASE_URL=mongodb://blog-database:27017/blog'
      - JWT_SECRET=a-string-secret-at-least-256-bits-long
    ports:
      - '3001:3001'
    depends_on:
      - blog-database
  blog-frontend:
    build:
      context: .
      args:
        VITE_BACKEND_URL: 'http://localhost:3001/api/v1'
    ports:
      - '3000:8080'
    depends_on:
      - blog-backend